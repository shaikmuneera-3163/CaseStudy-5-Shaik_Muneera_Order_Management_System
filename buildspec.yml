
version: 0.2

env:
  variables:
    HOME: "/tmp"
    GOCACHE: "/tmp/go-build-cache"
    GOMODCACHE: "/tmp/go-mod-cache"
    GOOS: "linux"
    GOARCH: "amd64"
    CGO_ENABLED: "0"

phases:
  install:
    commands:
      - echo "Checking Go version..."
      - go version
      - mkdir -p "$HOME" "$GOCACHE" "$GOMODCACHE"

  pre_build:
    commands:
      - echo "Downloading Go dependencies..."
      - go mod download
      - echo "Running Go tests..."
      - go test ./...

  build:
    commands:
      - echo "Building Gateway..."
      - mkdir -p dist
      - go build -o dist/gateway ./gateway
      - echo "Building Auth service..."
      - go build -o dist/auth ./services/auth
      - echo "Building Products service..."
      - go build -o dist/products ./services/products
      - echo "Building Orders service..."
      - go build -o dist/orders ./services/orders

  post_build:
    commands:
      - echo "Build and test phases completed."

artifacts:
  files:
    - dist/**/*
  discard-paths: no
